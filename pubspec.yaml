name: sushi_trio
description: Sushi Trio — sushi-themed match-3 (Flutter + Flame) prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.20.0
  flame_audio: ^2.12.2
  flutter_riverpod: ^3.4.3
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.2.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app.png
  remove_alpha_ios: true
  adaptive_icon_background: "#13307F"
  adaptive_icon_foreground: assets/icons/app_no_bg.png
  adaptive_icon_foreground_inset: 16

# Typed asset references (lib/gen/): `dart run build_runner build`.
flutter_gen:
  output: lib/gen/
  line_length: 80
  assets:
    exclude:
      - "**/source/**"
      - "**/*.md"
      - assets/levels/**
      - assets/icons/**
  integrations:
    image: true

flutter:
  uses-material-design: true
  fonts:
    - family: Mali
      fonts:
        - asset: assets/fonts/Mali-Regular.ttf
        - asset: assets/fonts/Mali-Bold.ttf
          weight: 700
  assets:
    - assets/levels/
    - assets/events/
    - assets/ui/
    - assets/ui/obstacles/
    - assets/ui/shops/
    - assets/backgrounds/
    - assets/sprites/sushi/
    - assets/sprites/power/
    - assets/sprites/boosters/
    - assets/sprites/furniture/
    - assets/sprites/tiles/
    - assets/sprites/map/common/
    - assets/sprites/customers/00-granny-sakura/
    - assets/sprites/customers/01-mr-tanaka/
    - assets/sprites/customers/02-little-mei/
    - assets/sprites/customers/03-lucky-cat/
    - assets/sprites/customers/04-yuki/
    - assets/sprites/customers/05-grandpa-taro/
    - assets/sprites/customers/06-ryo/
    - assets/sprites/customers/07-auntie-kiku/
    - assets/sprites/customers/08-masa/
    - assets/sprites/customers/09-taco-neesan/
    - assets/sprites/customers/10-oto/
    - assets/sprites/customers/11-aunt-hana/
    - assets/sprites/customers/12-ume/
    - assets/sprites/customers/13-haru/
    - assets/sprites/customers/14-monk-genjo/
    - assets/sprites/customers/15-captain-umi/
    - assets/sprites/customers/16-yukiko/
    - assets/sprites/customers/17-chef-kuma/
    - assets/sprites/obstacles/18-boss-cat-joker/
    - assets/audio/
