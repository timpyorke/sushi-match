name: sushi_trio
description: Sushi Trio — sushi-themed match-3 (Flutter + Flame) prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.20.0
  flame_audio: ^2.12.2
  flutter_riverpod: ^3.4.3
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app.png
  remove_alpha_ios: true
  adaptive_icon_background: "#13307F"
  adaptive_icon_foreground: assets/icons/app_no_bg.png
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  fonts:
    - family: Mali
      fonts:
        - asset: assets/fonts/Mali-Regular.ttf
        - asset: assets/fonts/Mali-Bold.ttf
          weight: 700
  assets:
    - assets/levels/
    - assets/ui/
    - assets/backgrounds/
    - assets/sprites/sushi/
    - assets/sprites/power/
    - assets/sprites/boosters/
    - assets/sprites/tiles/
    - assets/audio/
